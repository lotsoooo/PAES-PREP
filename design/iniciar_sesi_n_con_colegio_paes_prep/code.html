<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        [data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Loading Animation */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Transactional Screen: Navigation suppressed -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30 overflow-hidden">
<!-- Header -->
<div class="px-stack-lg pt-stack-lg pb-stack-sm text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">PAES Prep</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Inicia sesión para continuar tu preparación.</p>
</div>
<!-- Form Area -->
<div class="p-stack-lg">
<!-- Error State Example (Hidden by default, shown for demonstration) -->
<div class="hidden bg-error-container text-on-error-container p-stack-sm rounded-lg mb-stack-lg flex items-start gap-stack-sm border border-error/20" id="error-message">
<span class="material-symbols-outlined shrink-0 text-error mt-0.5">error</span>
<span class="font-body-md text-body-md text-sm">El correo electrónico o la contraseña son incorrectos. Por favor, inténtalo de nuevo.</span>
</div>
<form class="flex flex-col gap-stack-md" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none" id="email" placeholder="tu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="school">Colegio</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">school</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none" id="school" placeholder="Selecciona tu colegio" required="" type="text"/>
</div>
</div><div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<a class="font-caption text-caption text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 mt-2">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 bg-surface-container-lowest cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer text-sm" for="remember">Mantener sesión iniciada</label>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container py-3 rounded-lg font-label-md text-label-md transition-colors flex items-center justify-center gap-2 relative h-[48px]" id="submit-btn" onclick="window.location.href='{{DATA:SCREEN:SCREEN_23}}'" type="submit">
<span class="" id="btn-text">Iniciar Sesión</span>
<div class="hidden loader absolute" id="btn-loader"></div>
</button>
</form>
<!-- Signup Link -->
<div class="mt-stack-lg text-center font-body-md text-body-md">
<span class="text-on-surface-variant">¿No tienes una cuenta?</span>
<a class="text-primary font-semibold hover:underline ml-1" href="{{DATA:SCREEN:SCREEN_25}}">Regístrate</a>
</div>
<!-- Demo controls (for visualization purposes) -->
<div class="mt-8 pt-4 border-t border-outline-variant/30 text-center flex gap-4 justify-center">
<button class="text-xs text-error underline" onclick="showError()" type="button">Test Error State</button>
<button class="text-xs text-outline underline" onclick="resetForm()" type="button">Reset</button>
</div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        function handleLogin() {
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const errorMsg = document.getElementById('error-message');
            
            // Hide error if visible
            errorMsg.classList.add('hidden');
            
            // Show loading state
            btn.disabled = true;
            btnText.classList.add('invisible');
            btnLoader.classList.remove('hidden');
            btn.classList.add('opacity-90');
            
            // Simulate API call
            setTimeout(() => {
                // Reset loading state
                btn.disabled = false;
                btnText.classList.remove('invisible');
                btnLoader.classList.add('hidden');
                btn.classList.remove('opacity-90');
                
                // For demo purposes, let's just log
                console.log('Login attempt finished');
                // In a real app, handle success/redirect here
            }, 2000);
        }
        
        // Demo functions
        function showError() {
            const errorMsg = document.getElementById('error-message');
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            
            errorMsg.classList.remove('hidden');
            emailInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error/20');
            passInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error/20');
        }
        
        function resetForm() {
             const errorMsg = document.getElementById('error-message');
             const emailInput = document.getElementById('email');
             const passInput = document.getElementById('password');
             
             errorMsg.classList.add('hidden');
             emailInput.classList.remove('border-error', 'focus:border-error', 'focus:ring-error/20');
             passInput.classList.remove('border-error', 'focus:border-error', 'focus:ring-error/20');
             emailInput.value = '';
             passInput.value = '';
        }
    </script>
</body></html>
