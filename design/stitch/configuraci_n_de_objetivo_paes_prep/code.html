<body class="bg-background min-h-screen font-body-md text-on-background antialiased flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Progress Bar (Top) -->

<div class="h-full bg-primary" style="width: 25%;"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant p-stack-lg flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Decorative Header Element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container rounded-full blur-3xl opacity-20 -mr-16 -mt-16 pointer-events-none"></div>
<!-- Header Section -->
<header class="flex flex-col gap-stack-sm z-10">
<h1 class="font-headline-lg text-headline-lg md:font-display md:text-display text-primary">¿Cuál es tu meta?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Cuéntanos a qué carrera y universidad quieres entrar. Esto nos ayudará a personalizar tu plan de estudio.
            </p>
</header>
<!-- Search Section -->
<section class="flex flex-col gap-stack-sm z-10">
<label class="sr-only" for="career-search">Buscar carrera y universidad</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">search</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-container transition-all" id="career-search" placeholder="Ej: Ingeniería Comercial, U. de Chile..." type="text">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface hidden" id="clear-search" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Popular Options (Tags) -->
<div class="mt-stack-sm">
<p class="font-label-md text-label-md text-on-surface-variant mb-stack-sm">Opciones populares</p>
<div class="flex flex-wrap gap-2">
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface border border-outline-variant rounded-full px-4 py-2 font-label-md text-label-md transition-colors flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px] text-primary group-hover:scale-110 transition-transform">medical_services</span>
                        Medicina - U. de Chile
                    </button>
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface border border-outline-variant rounded-full px-4 py-2 font-label-md text-label-md transition-colors flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px] text-primary group-hover:scale-110 transition-transform">engineering</span>
                        Ingeniería - PUC
                    </button>
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface border border-outline-variant rounded-full px-4 py-2 font-label-md text-label-md transition-colors flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px] text-primary group-hover:scale-110 transition-transform">gavel</span>
                        Derecho - U. de Chile
                    </button>
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface border border-outline-variant rounded-full px-4 py-2 font-label-md text-label-md transition-colors flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px] text-primary group-hover:scale-110 transition-transform">architecture</span>
                        Arquitectura - PUC
                    </button>
</div>
</div>
</section>
<!-- Selected Goal Display (Hidden by default, shown via JS simulation) -->
<section class="hidden flex flex-col gap-stack-sm bg-surface-container-low border border-outline-variant rounded-lg p-stack-md z-10 transition-all duration-300" id="selected-goal-container">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-primary mb-1">Meta seleccionada</span>
<h3 class="font-headline-md text-headline-md text-on-surface" id="selected-career">Medicina</h3>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px]">school</span>
<span id="selected-university" class="">Universidad de Chile</span>
</p>
</div>

</button>

            </button>
<a href="{{DATA:SCREEN:SCREEN_7}}" class="w-full md:w-auto bg-primary hover:bg-on-primary-fixed-variant text-on-primary rounded-lg px-8 py-3 font-label-md text-label-md flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition-all" id="continue-btn">
                Continuar
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</a>

<script>
        // Simple interactions for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('career-search');
            const clearBtn = document.getElementById('clear-search');
            const tags = document.querySelectorAll('.flex-wrap button');
            const selectedGoalContainer = document.getElementById('selected-goal-container');
            const selectedCareer = document.getElementById('selected-career');
            const selectedUniversity = document.getElementById('selected-university');
            const removeGoalBtn = document.getElementById('remove-goal');
            const continueBtn = document.getElementById('continue-btn');

            function showGoal(career, uni) {
                selectedCareer.textContent = career;
                selectedUniversity.textContent = uni;
                selectedGoalContainer.classList.remove('hidden');
                searchInput.parentElement.parentElement.classList.add('hidden');
                continueBtn.removeAttribute('disabled');
                continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            function hideGoal() {
                selectedGoalContainer.classList.add('hidden');
                searchInput.parentElement.parentElement.classList.remove('hidden');
                searchInput.value = '';
                continueBtn.setAttribute('disabled', 'true');
                continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
                clearBtn.classList.add('hidden');
            }

            // Initial state for button
            continueBtn.classList.add('opacity-50', 'cursor-not-allowed');

            searchInput.addEventListener('input', (e) => {
                if (e.target.value.length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
            });

            tags.forEach(tag => {
                tag.addEventListener('click', () => {
                    const text = tag.textContent.trim();
                    const [career, uni] = text.split(' - ').map(s => s.trim());
                    // In a real app, this would strip the icon text first, simplified here
                    const actualCareer = career.replace(/^[a-z_]+\s*/i, '').trim(); 
                    showGoal(actualCareer || career, uni);
                });
            });

            removeGoalBtn.addEventListener('click', hideGoal);
        });
    </script>
