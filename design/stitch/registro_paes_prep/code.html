<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Transactional/Linear page: No global navigation shell rendered -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant overflow-hidden flex flex-col">
<!-- Header -->
<div class="p-8 pb-6 text-center border-b border-outline-variant/30">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">PAES Pro</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account to start preparing.</p>
</div>
<!-- Form Area -->
<div class="p-8 pt-6">
<!-- Google Login Button -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors duration-200 mb-6 font-label-md text-label-md text-on-surface">
<!-- Using a simple SVG for Google icon as it's typically custom -->
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Divider -->
<div class="relative flex py-4 items-center mb-6">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-caption text-caption text-outline">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Standard Form -->
<form class="space-y-stack-md">
<!-- Full Name Field (Default State) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullName">Full Name</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="fullName" placeholder="e.g. Juan Pérez" type="text">
</div>
<!-- Email Field (Focus State example - simulated with classes) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border-2 border-primary ring-2 ring-primary/20 rounded-lg font-body-md text-body-md text-on-surface focus:outline-none transition-all" id="email" placeholder="juan@example.com" type="email" value="juan@">
</div>
<!-- Password Field (Error State example) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-error-container/20 border-2 border-error rounded-lg font-body-md text-body-md text-on-surface pr-10 focus:outline-none transition-all" id="password" placeholder="Create a password" type="password" value="short">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<p class="font-caption text-caption text-error mt-1 flex items-center gap-1">
                        Password must be at least 8 characters long.
                    </p>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 mt-stack-lg" type="button" onclick="window.location.href='{{DATA:SCREEN:SCREEN_10}}'">
                    Create Account
                </button>
</form>
</div>
<!-- Footer Link -->
<div class="p-6 bg-surface-container-low text-center border-t border-outline-variant/30">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="font-bold text-primary hover:text-primary-container hover:underline transition-colors" href="#">Log in</a>
</p>
</div>
</div>
